# .streamlit/config.toml
# Must sit in the folder you run `streamlit run app.py` from
# (on Streamlit Community Cloud: the repo root).

[theme]
base = "light"
# Manganese violet: the accent for buttons, sliders, selected tabs
primaryColor = "#5A3E9B"
# Page background: cool survey-sheet grey; widgets and sidebar sit one step darker
backgroundColor = "#F6F7FA"
secondaryBackgroundColor = "#E9ECF3"
textColor = "#1A2236"
font = "sans serif"

# The keys below need a recent Streamlit release. If your version warns
# about unknown keys, delete this block; nothing else depends on it.
baseRadius = "medium"
borderColor = "#D5DAE5"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#ECEFF5"
secondaryBackgroundColor = "#DFE4EE"

[client]
# Hides developer menu items so the demo looks like a product, not a script
toolbarMode = "minimal"

[server]
runOnSave = true

[browser]
gatherUsageStats = false
